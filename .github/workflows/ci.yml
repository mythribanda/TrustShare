# Run quality checks for the application on pushes and pull requests.
name: CI

on:
  push:
    branches:
      - main
      - trustshare-complete
  pull_request:
    branches:
      - main
      - trustshare-complete

permissions:
  contents: read

jobs:
  backend:
    name: Backend - lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trustshare
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: trustshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustshare"
          --health-interval 5s
          --health-retries 10
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: trustshare
          MONGO_INITDB_ROOT_PASSWORD: ci-password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-retries 10

    env:
      POSTGRES_USER: trustshare
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: trustshare
      MONGO_USER: trustshare
      MONGO_PASSWORD: ci-password
      REDIS_PASSWORD: ci-password
      JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-characters-long
      MFA_ENCRYPTION_KEY: Y2ktb25seS1tZmEta2V5LW5vdC1hLXNlY3JldC0zMmI=
      MASTER_KEYS: "1:Y2ktb25seS1tYXN0ZXIta2V5LTMyLWJ5dGVzLWxvbmc="
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: ci-storage
      S3_SECRET_ACCESS_KEY: ci-storage-password
      AZURE_TEST_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://localhost:10000/devstoreaccount1;"
      STORAGE_DIR: /tmp/trustshare-storage

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start Redis
        run: docker run -d -p 6379:6379 redis:7-alpine redis-server --requirepass ci-password

      - name: Start S3-compatible storage
        run: >-
          docker run -d -p 9000:9000
          -e RUSTFS_ACCESS_KEY=ci-storage
          -e RUSTFS_SECRET_KEY=ci-storage-password
          rustfs/rustfs:1.0.3

      - name: Start Azure Blob emulator
        run: >-
          docker run -d -p 10000:10000
          mcr.microsoft.com/azure-storage/azurite:3.35.0
          azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Check Python lint
        run: ruff check .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: pytest -v

  frontend:
    name: Frontend - lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
